defaults:
  - _self_
  - focus: timesmooth
  - event: event_20210101
  # - debug
  # - profile

output_fn: "autofocus.h5"

hydra:
  job:
    chdir: true
  job_logging:
    formatters:
      simple:
        datefmt: '%Y-%m-%d %H:%M:%S'
        fmt: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
    handlers:
      console:
        level: WARNING