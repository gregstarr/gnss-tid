# Grid simulation mode: analytical scenario, explicit trials, seeded noise.
# Retains the legacy flat keys so existing Hydra overrides stay effective.
defaults:
  - client: sagan
  - _self_

# --- detector (estimator) settings, flat keys preserved ---
nfft: 128
block_size: 32
step_size: 8
norm: patch
smooth_win: 9
q_threshold: 0.95
density_threshold: 5

# --- experiment ---
n_trials: 100
batch_size: 10            # estimation batches
generation_batch_size: 10
seed: 1234
reference_time: "2025-01-01T00:00:00"  # UTC, also the scenario epoch
output_dtype: float32
save: true

# legacy flat fallback when scenario.sources is absent
wave_type: spherical

scenario:
  sources:
    - wave:
        type: planar               # planar | circular | spherical alias
        wavelength_km: [150, 400]
        period_min: [15, 45]
        direction_deg: [0, 360]    # planar only; 0 = +x
        center_x_km: 0
        center_y_km: 0
        phase_rad: 0
        amplitude_tecu: 0.15
      envelope:
        type: gaussian
        sigma_u_km: 350
        sigma_v_km: 600
        center_u_km: 0
        speed_ratio: 0.9
        spreading_time_s: 3600   # null disables spreading

sampler:
  type: grid
  start_time: "2025-01-01T00:00:00"
  end_time: "2025-01-01T02:00:00"
  cadence_s: 60
  xlim: [-1500, 1500]
  ylim: [-1500, 1500]
  hres: 20

forward_model:
  type: analytical

noise:
  std_tecu: 0.02              # null/zero = no noise

image:
  hp_freq: null                # null bypasses the spatial high-pass
  grid_smoothing_pixels: 0     # legacy wrappers keep their 3x3 behavior
  reconstruction_height_km: 350

output:
  root: ./results
  experiment_id: null          # collision-resistant ID generated when absent
  overwrite: false

hydra:
  job_logging:
    formatters:
      simple:
        datefmt: '%Y-%m-%d %H:%M:%S'
        fmt: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
