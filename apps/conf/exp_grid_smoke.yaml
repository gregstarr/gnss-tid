# Small locally-runnable grid smoke config: single planar source, well-resolved,
# noiseless, unsmoothed, unfiltered, unbounded. Use with:
#   uv run python apps/synthetic_exp.py --config-name exp_grid_smoke client=laptop
defaults:
  - client: laptop
  - _self_

nfft: 128
block_size: 32
step_size: 8
norm: patch
smooth_win: 9
q_threshold: 0.95
density_threshold: 5

n_trials: 3
batch_size: 2
generation_batch_size: 2
seed: 42
reference_time: "2025-01-01T00:00:00"
output_dtype: float32
save: false

wave_type: spherical

scenario:
  sources:
    - wave:
        type: planar
        wavelength_km: 300
        period_min: 30
        direction_deg: 30
        center_x_km: 0
        center_y_km: 0
        phase_rad: 0
        amplitude_tecu: 1.0

sampler:
  type: grid
  start_time: "2025-01-01T00:00:00"
  end_time: "2025-01-01T02:00:00"
  cadence_s: 60
  xlim: [-1500, 1500]
  ylim: [-1500, 1500]
  hres: 20

forward_model:
  type: analytical

noise:
  std_tecu: null

image:
  hp_freq: null
  grid_smoothing_pixels: 0
  reconstruction_height_km: 350

output:
  root: ./results
  experiment_id: null

hydra:
  job_logging:
    formatters:
      simple:
        datefmt: '%Y-%m-%d %H:%M:%S'
        fmt: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
