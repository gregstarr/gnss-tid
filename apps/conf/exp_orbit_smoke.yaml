# Deterministic orbit smoke config: geometry-only GNSS from simulated receivers
# and satellites. No navigation files required; uses deterministic orbital geometry
# from a fixed seed. Run with:
#   uv run python apps/synthetic_exp.py --config-name exp_orbit_smoke client=laptop
defaults:
  - client: laptop
  - _self_

nfft: 128
block_size: 32
step_size: 8
norm: patch
smooth_win: 9
q_threshold: 0.95
density_threshold: 2

n_trials: 2
batch_size: 2
generation_batch_size: 2
seed: 42
reference_time: "2025-01-01T00:00:00"
output_dtype: float32
save: false

wave_type: spherical

scenario:
  sources:
    - wave:
        type: planar
        wavelength_km: 300
        period_min: 30
        direction_deg: 30
        center_x_km: 0
        center_y_km: 0
        phase_rad: 0
        amplitude_tecu: 1.0

sampler:
  type: orbit_gnss
  n_rx: 8
  n_sat: 12
  lat_range: [35, 45]
  lon_range: [-110, -100]
  el_min: 5
  seed: 7
  start_time: "2025-01-01T00:00:00"
  end_time: "2025-01-01T02:00:00"
  cadence_s: 60

forward_model:
  type: analytical

noise:
  std_tecu: null

image:
  image_maker:
    _target_: gnss_tid.image.MetpyImageMaker
    hres: 20
    hp_freq: null
    neighbor_radius: 100.0
    interp_type: linear
  hp_freq: null
  reconstruction_height_km: 350
  window: 1
  step: 1

output:
  root: ./results
  experiment_id: null

hydra:
  job_logging:
    formatters:
      simple:
        datefmt: '%Y-%m-%d %H:%M:%S'
        fmt: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
