# Fast profiling preset: 3 time windows x 4 heights, single-threaded.
# Pinned explicitly so the 3x4 shape holds even if other defaults change:
# - files + time_limits: 30 min span on the 30 s-cadence 20210101 data yields
#   exactly 3 windows with sample.window/step (8/20)
# - height range: arange(100, 600, 125) = 4 heights
event:
  files:
    - /disk1/tid/2021/0101/*.nc
  time_limits:
    - "20210101_140000"
    - "20210101_143000"

sample:
  window: 8
  step: 20

focus:
  n_jobs: 1
  height_min: 100
  height_max: 600
  height_step: 125
