defaults:
  - client: sagan
  - _self_

folder: outputs/20241206

input_fn: autofocus.h5

parameters:
  name: spectral_dask
  block_size: 32
  step_size: 8
  nfft: 128
  normalize: image
  q_threshold: 0.95

output_fn: params_image_95.zarr

hydra:
  run:
    dir: ${folder}
  output_subdir: .param_hydra
  job:
    chdir: true
  job_logging:
    formatters:
      simple:
        datefmt: '%Y-%m-%d %H:%M:%S'
        fmt: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
