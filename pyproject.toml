[project]
name = "gnss-tid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.26",
    "dask[distributed]>=2026.8",
    "georinex>=1.16",
    "h5netcdf>=1.8",
    "h5py>=3.16",
    "hydra-core>=1.3",
    "matplotlib>=3.11",
    "metpy>=1.7",
    "pandas>=3.0",
    "pymap3d>=3.2",
    "scikit-image>=0.26",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "seaborn>=0.13",
    "torch>=2.14",
    "tqdm-joblib>=0.0.5",
    "xarray>=2026.5",
    "zarr>=3.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bokeh>=3.10",
    "colorcet>=3.2",
    "holoviews>=1.23",
    "ipykernel>=7.4",
    "ipywidgets>=8.1",
    "jupyter-bokeh>=4.1",
    "nb-clean>=4.0",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
no-cache = true
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
